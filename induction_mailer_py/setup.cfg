[metadata]
name = induction-mailer
version = 0.1.0
description = Outlook COM mail automation + template-driven induction mailer (ported from VBS).
long_description = file: README.md
long_description_content_type = text/markdown
author = Giacomo Damilano
license = MIT

[options]
packages = find:
python_requires = >=3.9
include_package_data = True
zip_safe = False

# Keep install_requires empty to support offline installs in constrained environments.
# Install optional dependencies via conda/pip as needed (see extras below).
install_requires =

[options.extras_require]
outlook =
    pywin32>=305
excel =
    openpyxl>=3.1
all =
    pywin32>=305
    openpyxl>=3.1

[options.entry_points]
console_scripts =
    induction-mailer = induction_mailer.cli:main
    gal-lookup = induction_mailer.scripts.gal_lookup:main
    directory-probe = induction_mailer.scripts.directory_probe:main
    group-meetings-manager = induction_mailer.scripts.group_meetings_manager:main

[options.packages.find]
where = .
include = induction_mailer*
